  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030208;
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }

    /* --- PANTALLA DE CARGA DEL AUDIO --- */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #030208;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffe875;
      font-size: 1.2rem;
      transition: opacity 0.6s ease, visibility 0.6s;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 230, 0, 0.2);
      border-top: 4px solid #ffea00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* --- TÍTULO Y SUBTÍTULO CENTRADOS --- */
    .header-overlay {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      width: 90%;
      max-width: 600px;
      pointer-events: none;
    }

    .header-overlay h1 {
      font-size: clamp(1.6rem, 4.5vw, 2.8rem);
      font-weight: 700;
      color: #fffef0;
      text-shadow: 0 0 10px rgba(255, 230, 0, 0.8),
                   0 0 20px rgba(255, 200, 0, 0.5),
                   0 0 30px rgba(255, 180, 0, 0.3);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .header-overlay p {
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      color: #ffe875;
      opacity: 0.9;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
      font-weight: 300;
      letter-spacing: 1px;
    }
  </style>

    };

    /* =========================================================================
     * SISTEMA DE PRECARGA DE AUDIO
     * ========================================================================= */
    let customAudio = null;
    let musicStarted = false;
    const loaderElement = document.getElementById('loader');

    function hideLoader() {
      if (loaderElement) {
        loaderElement.style.opacity = '0';
        setTimeout(() => { loaderElement.style.display = 'none'; }, 600);
      }
    }

    function preloadAndStartAudio() {
      if (CONFIG.musicaURL && CONFIG.musicaURL.trim() !== "") {
        customAudio = new Audio();
        customAudio.src = CONFIG.musicaURL;
        customAudio.loop = true;
        customAudio.preload = "auto";

        // Detecta cuándo se ha descargado lo suficiente para reproducirse sin interrupciones
        customAudio.addEventListener('canplaythrough', () => {
          hideLoader();
          tryPlayAudio();
        }, { once: true });

        // Tiempo límite de seguridad en caso de conexión lenta
        setTimeout(hideLoader, 4000);
      } else {
        hideLoader();
        playSynthBackgroundMusic();
      }
    }

    function tryPlayAudio() {
      if (musicStarted) return;
      if (customAudio) {
        customAudio.play().then(() => {
          musicStarted = true;
        }).catch(() => {
          // El navegador esperará al primer toque si bloquea la autoreproducción
        });
      }
    }

    // Activa el audio con la primera interacción del usuario si el navegador lo bloqueó
    window.addEventListener('pointerdown', () => {
      if (!musicStarted && customAudio) {
        customAudio.play();
        musicStarted = true;
      } else if (!musicStarted && !CONFIG.musicaURL) {
        playSynthBackgroundMusic();
      }
    }, { once: true });

    preloadAndStartAudio();

    /* =========================================================================
     * INICIALIZACIÓN DE TEXTOS EN INTERFAZ
     * ========================================================================= */
    document.getElementById('ui-title').innerText = CONFIG.titulo;
    document.getElementById('ui-subtitle').innerText = CONFIG.subtitulo;

    /* =========================================================================
     * MOTOR 3D Y ESCENA (THREE.JS)
     * ========================================================================= */
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030208, 0.0012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 45, 110);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.0;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.maxDistance = 300;
    controls.minDistance = 10;

    /* =========================================================================
     * GENERADOR DE TEXTURA DE FLOR AMARILLA
     * ========================================================================= */
    function createFlowerTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.2, 'rgba(255, 235, 50, 0.95)');
      grad.addColorStop(0.6, 'rgba(255, 170, 0, 0.4)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);

      ctx.fillStyle = 'rgba(255, 220, 0, 0.85)';
      const petals = 6;
      for (let i = 0; i < petals; i++) {
        const angle = (i * 2 * Math.PI) / petals;
        const x = 64 + Math.cos(angle) * 22;
        const y = 64 + Math.sin(angle) * 22;
        ctx.beginPath();
        ctx.arc(x, y, 12, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#ff9900';
      ctx.beginPath();
      ctx.arc(64, 64, 8, 0, Math.PI * 2);
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    const flowerTexture = createFlowerTexture();

    /* =========================================================================
     * CREACIÓN DE PARTÍCULAS Y FLORES DE LA GALAXIA
     * ========================================================================= */
    const count = CONFIG.cantidadFlores;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    const cInside = new THREE.Color(CONFIG.colorCentro);
    const cOutside = new THREE.Color(CONFIG.colorExterior);

    for (let i = 0; i < count; i++) {
      const i3 = i * 3;
      const radius = Math.random() * 140 + 2;
      const spinAngle = radius * 0.12;
      const branchAngle = ((i % 4) * 2 * Math.PI) / 4;

      const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 12;
      const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 12;
      const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 12;

      positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
      positions[i3 + 1] = randomY;
      positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

      const mixedColor = cInside.clone().lerp(cOutside, radius / 140);
      colors[i3] = mixedColor.r;
      colors[i3 + 1] = mixedColor.g;
      colors[i3 + 2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 2.8,
      sizeAttenuation: true,
      map: flowerTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      vertexColors: true
    });

    const galaxy = new THREE.Points(geometry, material);
    scene.add(galaxy);

    /* =========================================================================
     * MENSAJES FLOTANTES EN EL ESPACIO 3D
     * ========================================================================= */
    function createTextSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.font = 'Bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fffbcf';
      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = 12;
      ctx.fillText(text, 256, 70);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(30, 7.5, 1);
      return sprite;
    }

    if (CONFIG.mensajesFlotantes && CONFIG.mensajesFlotantes.length > 0) {
      CONFIG.mensajesFlotantes.forEach((msg, idx) => {
        const sprite = createTextSprite(msg);
        const angle = (idx / CONFIG.mensajesFlotantes.length) * Math.PI * 2;
        const rad = 50 + Math.random() * 30;
        sprite.position.set(Math.cos(angle) * rad, (Math.random() - 0.5) * 20, Math.sin(angle) * rad);
        scene.add(sprite);
      });
    }

    /* =========================================================================
     *  IMÁGENES FLOTANTES EN EL ESPACIO 3D
     * ========================================================================= */
    if (CONFIG.imagenesFlotantes && CONFIG.imagenesFlotantes.length > 0) {
      const textureLoader = new THREE.TextureLoader();
      CONFIG.imagenesFlotantes.forEach((url, idx) => {
        textureLoader.load(url, (tex) => {
          const planeGeo = new THREE.PlaneGeometry(16, 16);
          const planeMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true });
          const mesh = new THREE.Mesh(planeGeo, planeMat);

          const angle = (idx / CONFIG.imagenesFlotantes.length) * Math.PI * 2 + 0.5;
          const rad = 65;
          mesh.position.set(Math.cos(angle) * rad, (Math.random() - 0.5) * 15, Math.sin(angle) * rad);
          mesh.lookAt(0, 0, 0);
          scene.add(mesh);
        });
      });
    }

    /* =========================================================================
     * AUDIO SINTETIZADO (SI NO HAY URL DE MÚSICA)
     * ========================================================================= */
    function playSynthBackgroundMusic() {
      if (musicStarted) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioCtx();
        if (audioContext.state === 'suspended') audioContext.resume();

        const notes = [261.63, 329.63, 392.00, 493.88, 523.25];
        let step = 0;

        function playNote() {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(notes[step % notes.length], audioContext.currentTime);

          gain.gain.setValueAtTime(0.01, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.08, audioContext.currentTime + 0.8);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 3.5);

          osc.connect(gain);
          gain.connect(audioContext.destination);

          osc.start();
          osc.stop(audioContext.currentTime + 3.6);

          step++;
          setTimeout(playNote, 1800);
        }

        playNote();
        musicStarted = true;
      } catch (e) {}
    }

    /* =========================================================================
     * BUCLE DE ANIMACIÓN
     * ========================================================================= */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      galaxy.rotation.y = elapsedTime * 0.04;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
